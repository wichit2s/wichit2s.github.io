<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIMIC-IV hosp Module Interactive SVG ERD</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
    .svg-node { transition: all 0.25s ease-out; cursor: pointer; }
    .svg-node:hover { filter: drop-shadow(0 0 12px rgba(6, 182, 212, 0.6)); }
    .svg-connection { transition: all 0.25s ease-out; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen antialiased flex flex-col custom-scrollbar" x-data="erdApp()">

  <!-- HEADER BAR -->
  <header x-cloak class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-6 py-3.5 shadow-2xl">
    <div class="max-w-7xl mx-auto flex flex-col lg:flex-row lg:items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-xl shadow-lg shadow-cyan-500/20 text-white font-mono font-bold text-lg">
          SVG
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <h1 class="text-lg font-extrabold text-white tracking-tight">MIMIC-IV <span class="text-cyan-400 font-mono">hosp</span> ERD Explorer</h1>
            <span class="text-[11px] px-2.5 py-0.5 rounded-full bg-cyan-950 text-cyan-300 border border-cyan-800/60 font-semibold">22 Tables</span>
          </div>
          <p class="text-xs text-slate-400">
            Interactive Visual Diagram & Data Dictionary • 
            <a href="https://mimic.mit.edu/docs/iv/modules/hosp/" target="_blank" class="text-cyan-400 hover:underline">mimic.mit.edu/docs/iv/modules/hosp</a>
          </p>
        </div>
      </div>

      <!-- SEARCH & CONTROLS -->
      <div class="flex flex-wrap items-center gap-3">
        <div class="relative w-full sm:w-64">
          <svg class="w-4 h-4 absolute left-3 top-2.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <input 
            type="text" 
            x-model="searchQuery" 
            placeholder="Search table or column..." 
            class="w-full bg-slate-800 text-slate-100 text-xs rounded-xl pl-9 pr-8 py-2 border border-slate-700 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition"
          />
          <button x-show="searchQuery" @click="searchQuery = ''" class="absolute right-2.5 top-2 text-slate-400 hover:text-white text-xs">✕</button>
        </div>

        <div class="flex bg-slate-800 p-1 rounded-xl border border-slate-700 text-xs font-medium">
          <button @click="viewMode = 'svg'" :class="viewMode === 'svg' ? 'bg-cyan-600 text-white font-bold shadow' : 'text-slate-400 hover:text-white'" class="px-3 py-1.5 rounded-lg transition">
            🎨 Interactive SVG ERD
          </button>
          <button @click="viewMode = 'visual'" :class="viewMode === 'visual' ? 'bg-cyan-600 text-white font-bold shadow' : 'text-slate-400 hover:text-white'" class="px-3 py-1.5 rounded-lg transition">
            🗺️ Category Cards
          </button>
          <button @click="viewMode = 'grid'" :class="viewMode === 'grid' ? 'bg-cyan-600 text-white font-bold shadow' : 'text-slate-400 hover:text-white'" class="px-3 py-1.5 rounded-lg transition">
            📋 Grid Dictionary
          </button>
        </div>
      </div>
    </div>

    <!-- CATEGORIES BAR -->
    <div class="max-w-7xl mx-auto flex items-center space-x-2 mt-3 overflow-x-auto pb-1 custom-scrollbar text-xs">
      <span class="text-slate-400 font-semibold mr-1">Filter:</span>
      <button @click="selectedCategory = 'all'" :class="selectedCategory === 'all' ? 'bg-cyan-500 text-slate-950 font-bold' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'" class="px-3 py-1 rounded-full border border-slate-700 transition">
        All (22)
      </button>
      <template x-for="cat in categories" :key="cat.id">
        <button @click="selectedCategory = cat.id" :class="selectedCategory === cat.id ? 'bg-cyan-500 text-slate-950 font-bold' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'" class="px-3 py-1 rounded-full border border-slate-700 transition flex items-center space-x-1.5">
          <span x-text="cat.icon"></span>
          <span x-text="cat.name"></span>
          <span class="text-[10px] opacity-75" x-text="'(' + getCategoryCount(cat.id) + ')'"></span>
        </button>
      </template>
    </div>
  </header>

  <!-- MAIN CANVAS -->
  <main x-cloak class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 relative">

    <!-- SVG DIAGRAM MODE -->
    <div x-show="viewMode === 'svg'" class="space-y-4">
      <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 text-xs flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-slate-300">
        <div class="flex items-center space-x-3">
          <span class="text-2xl">🗺️</span>
          <div>
            <strong>Interactive SVG ERD Canvas:</strong> Click any table header box to view full columns & data dictionary. Hover over a table node to highlight foreign key relationships!
          </div>
        </div>
        <button @click="resetFilters()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs transition">
          Reset Filters
        </button>
      </div>

      <!-- SVG CANVAS CONTAINER -->
      <div class="bg-slate-900/90 border border-slate-800 rounded-3xl p-4 overflow-x-auto custom-scrollbar shadow-2xl relative">
        <div class="relative w-[1650px] h-[980px] select-none">
          <!-- Static background SVG (grid + category areas) — no Alpine directives inside -->
          <svg class="absolute inset-0 w-[1650px] h-[980px]" viewBox="0 0 1650 980" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8"/>
              </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#grid)" />
            <g opacity="0.15">
              <rect x="50" y="40" width="510" height="730" rx="20" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
              <text x="70" y="70" fill="#38bdf8" font-size="16" font-weight="bold">Patients & Admissions Core</text>
              <rect x="610" y="40" width="510" height="390" rx="20" fill="#0d9488" stroke="#2dd4bf" stroke-width="2"/>
              <text x="630" y="70" fill="#2dd4bf" font-size="16" font-weight="bold">Labs & Microbiology</text>
              <rect x="610" y="440" width="510" height="510" rx="20" fill="#a855f7" stroke="#c084fc" stroke-width="2"/>
              <text x="630" y="470" fill="#c084fc" font-size="16" font-weight="bold">Orders & Medications</text>
              <rect x="1140" y="180" width="490" height="670" rx="20" fill="#eab308" stroke="#fde047" stroke-width="2"/>
              <text x="1160" y="210" fill="#fde047" font-size="16" font-weight="bold">Billing & Coding System</text>
            </g>
          </svg>

          <!-- Relationship lines — rendered via x-html string to avoid Alpine <template> inside SVG (causes "table/conn is not defined") -->
          <div class="absolute inset-0 w-[1650px] h-[980px] pointer-events-none" x-html="connectionsSvgHtml"></div>

          <!-- Table nodes — HTML absolutely-positioned cards (avoids SVG Alpine scoping bugs with nested x-for and table variable) -->
          <div id="table-nodes" class="absolute inset-0">
            <template x-for="table in tables" :key="table.id">
              <div
                x-show="isTableVisible(table)"
                class="svg-node absolute rounded-xl border flex flex-col overflow-hidden cursor-pointer transition-all duration-200 shadow-lg"
                :style="'left:' + table.pos.x + 'px; top:' + table.pos.y + 'px; width:' + table.pos.w + 'px; height:' + table.pos.h + 'px; background:' + getNodeBg(table) + '; border-color:' + getNodeStroke(table) + '; border-width:' + getNodeStrokeWidth(table) + 'px;'"
                @mouseenter="hoveredTable = table.id"
                @mouseleave="hoveredTable = null"
                @click="openDetail(table)"
              >
                <div class="h-8 flex items-center justify-between px-3 shrink-0" :style="'background:' + getHeaderFill(table)">
                  <span class="text-white font-mono font-bold text-[13px] truncate" x-text="table.name"></span>
                  <span class="text-cyan-200 font-mono font-bold text-[10px] ml-2 shrink-0" x-text="table.pk.length > 0 ? 'PK' : (table.fk.length > 0 ? 'FK' : '')"></span>
                </div>
                <div class="px-3 pt-2 pb-1 flex-1 flex flex-col gap-1">
                  <template x-for="col in table.columns.slice(0, 4)" :key="col.name">
                    <div class="flex items-center justify-between text-[11px] leading-none">
                      <div class="flex items-center gap-1.5 min-w-0">
                        <span class="text-[10px] shrink-0" x-text="col.key === 'PK' ? '🔑' : (col.key === 'FK' ? '🔗' : '•')"></span>
                        <span class="font-mono font-semibold text-slate-200 truncate" x-text="col.name.length > 15 ? col.name.substring(0, 14) + '…' : col.name"></span>
                      </div>
                      <span class="font-mono text-[9px] text-slate-400 ml-2 shrink-0" x-text="col.type.length > 10 ? col.type.substring(0, 8) + '…' : col.type"></span>
                    </div>
                  </template>
                  <div class="text-[9px] text-sky-400 pt-0.5" x-show="table.columns.length > 4" x-text="'+ ' + (table.columns.length - 4) + ' more...'"></div>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </div>

    <!-- CATEGORY CARDS MODE -->
    <div x-show="viewMode === 'visual'" class="space-y-8">
      <template x-for="cat in categories" :key="cat.id">
        <div x-show="getCategoryTables(cat.id).length > 0" class="bg-slate-900/40 border border-slate-700 rounded-3xl p-6 relative">
          <div class="flex items-center space-x-3 mb-4 pb-3 border-b border-slate-800">
            <span class="text-2xl" x-text="cat.icon"></span>
            <div>
              <h3 class="text-base font-bold text-white" x-text="cat.name"></h3>
              <p class="text-xs text-slate-400" x-text="cat.description"></p>
            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <template x-for="table in getCategoryTables(cat.id)" :key="table.id">
              <div 
                class="table-card bg-slate-900 rounded-2xl border transition-all duration-200 shadow-lg flex flex-col overflow-hidden group cursor-pointer"
                :class="getTableCardClass(table)"
                @mouseenter="hoveredTable = table.id"
                @mouseleave="hoveredTable = null"
                @click="openDetail(table)"
              >
                <div class="p-3.5 bg-gradient-to-r flex items-center justify-between border-b" :class="getHeaderBgClass(table)">
                  <span class="font-mono text-sm font-bold text-white group-hover:text-cyan-300" x-text="table.name"></span>
                  <div class="flex items-center space-x-1.5 text-[10px]">
                    <span x-show="table.pk.length > 0" class="bg-amber-500/20 text-amber-300 border border-amber-500/40 px-1.5 py-0.5 rounded font-mono font-semibold">PK</span>
                    <span x-show="table.fk.length > 0" class="bg-blue-500/20 text-blue-300 border border-blue-500/40 px-1.5 py-0.5 rounded font-mono font-semibold">FK</span>
                  </div>
                </div>
                <div class="p-3 text-xs text-slate-300 border-b border-slate-800/60 leading-relaxed" x-text="table.description"></div>
                <div class="p-3 bg-slate-950/60 flex-1 space-y-1.5 text-xs font-mono">
                  <template x-for="col in table.columns.slice(0, 5)" :key="col.name">
                    <div class="flex items-center justify-between text-[11px]">
                      <div class="flex items-center space-x-1.5">
                        <span x-show="col.key === 'PK'" class="text-amber-400 text-[10px]">🔑</span>
                        <span x-show="col.key === 'FK'" class="text-blue-400 text-[10px]">🔗</span>
                        <span class="truncate font-semibold text-slate-200" x-text="col.name"></span>
                      </div>
                      <span class="text-slate-500 text-[10px]" x-text="col.type"></span>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>

    <!-- GRID DICTIONARY MODE -->
    <div x-show="viewMode === 'grid'" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <template x-for="table in filteredTables" :key="table.id">
        <div @click="openDetail(table)" class="bg-slate-900 border border-slate-800 hover:border-cyan-500 rounded-2xl p-5 cursor-pointer transition shadow-lg flex flex-col justify-between group">
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="font-mono text-base font-bold text-white group-hover:text-cyan-400" x-text="table.name"></span>
              <span class="text-xs bg-slate-800 border border-slate-700 text-slate-300 px-2 py-0.5 rounded-full" x-text="table.category"></span>
            </div>
            <p class="text-xs text-slate-400 mb-4 leading-relaxed" x-text="table.description"></p>
          </div>
          <div class="pt-3 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
            <span x-text="table.columns.length + ' columns'"></span>
            <span class="text-cyan-400 font-semibold group-hover:underline">View Schema & SQL →</span>
          </div>
        </div>
      </template>
    </div>

  </main>

  <!-- TABLE DETAIL MODAL DRAWER -->
  <div 
    x-show="detailOpen" 
    class="fixed inset-0 z-50 overflow-hidden bg-slate-950/80 backdrop-blur-sm flex justify-end transition-opacity"
    x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    @keydown.window.escape="detailOpen = false"
  >
    <div 
      class="bg-slate-900 border-l border-slate-800 w-full max-w-2xl h-full shadow-2xl flex flex-col custom-scrollbar overflow-y-auto"
      @click.outside="detailOpen = false"
    >
      <template x-if="activeTable">
        <div class="p-6 flex-1 flex flex-col">
          <div class="flex items-start justify-between border-b border-slate-800 pb-4 mb-6">
            <div>
              <div class="flex items-center space-x-3 mb-1">
                <h2 class="text-2xl font-mono font-extrabold text-cyan-300" x-text="activeTable.name"></h2>
                <span class="text-xs bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-full text-slate-300 font-semibold" x-text="activeTable.category"></span>
              </div>
              <p class="text-xs text-slate-300 leading-relaxed" x-text="activeTable.description"></p>
            </div>
            <button @click="detailOpen = false" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-slate-400 hover:text-white">✕</button>
          </div>

          <div class="flex space-x-2 border-b border-slate-800 mb-6 text-xs font-semibold">
            <button @click="detailTab = 'schema'" :class="detailTab === 'schema' ? 'border-b-2 border-cyan-400 text-cyan-400 pb-2.5' : 'text-slate-400 hover:text-white pb-2.5'">
              📊 Columns & Schema (<span x-text="activeTable.columns.length"></span>)
            </button>
            <button @click="detailTab = 'relations'" :class="detailTab === 'relations' ? 'border-b-2 border-cyan-400 text-cyan-400 pb-2.5' : 'text-slate-400 hover:text-white pb-2.5'">
              🔗 Foreign Keys & Links (<span x-text="activeTable.relationships.length"></span>)
            </button>
            <button @click="detailTab = 'sql'" :class="detailTab === 'sql' ? 'border-b-2 border-cyan-400 text-cyan-400 pb-2.5' : 'text-slate-400 hover:text-white pb-2.5'">
              💻 Sample SQL Query
            </button>
          </div>

          <!-- TAB 1: COLUMNS -->
          <div x-show="detailTab === 'schema'" class="space-y-4 flex-1">
            <div class="overflow-x-auto rounded-xl border border-slate-800 bg-slate-950">
              <table class="w-full text-left text-xs text-slate-300 border-collapse">
                <thead class="bg-slate-900 text-slate-400 font-mono text-[11px] uppercase border-b border-slate-800">
                  <tr>
                    <th class="p-3">Key</th>
                    <th class="p-3">Column Name</th>
                    <th class="p-3">Data Type</th>
                    <th class="p-3">Description</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800">
                  <template x-for="col in activeTable.columns" :key="col.name">
                    <tr class="hover:bg-slate-900/60 transition">
                      <td class="p-3 font-mono">
                        <span x-show="col.key === 'PK'" class="bg-amber-500/20 text-amber-300 border border-amber-500/40 px-1.5 py-0.5 rounded text-[10px] font-bold">PK</span>
                        <span x-show="col.key === 'FK'" class="bg-blue-500/20 text-blue-300 border border-blue-500/40 px-1.5 py-0.5 rounded text-[10px] font-bold">FK</span>
                        <span x-show="!col.key" class="text-slate-600">-</span>
                      </td>
                      <td class="p-3 font-mono font-bold text-white" x-text="col.name"></td>
                      <td class="p-3 font-mono text-cyan-300 text-[11px]" x-text="col.type"></td>
                      <td class="p-3 text-slate-300 leading-snug" x-text="col.desc"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>

          <!-- TAB 2: RELATIONSHIPS -->
          <div x-show="detailTab === 'relations'" class="space-y-4 flex-1">
            <div x-show="activeTable.fk.length > 0" class="space-y-3">
              <h4 class="text-xs font-bold text-yellow-300 uppercase tracking-wider">Outgoing Foreign Keys:</h4>
              <div class="space-y-2">
                <template x-for="fk in activeTable.fk" :key="fk.col">
                  <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 flex items-center justify-between text-xs font-mono">
                    <div>
                      <span class="text-blue-400 font-bold" x-text="fk.col"></span>
                      <span class="text-slate-500">➜</span>
                      <span class="text-cyan-300 font-bold" x-text="fk.ref_table + '.' + fk.ref_col"></span>
                    </div>
                    <button @click="openDetailById(fk.ref_table)" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-cyan-300 rounded-lg text-[11px] transition">
                      Jump to Table ➔
                    </button>
                  </div>
                </template>
              </div>
            </div>

            <div class="space-y-3 pt-4 border-t border-slate-800">
              <h4 class="text-xs font-bold text-emerald-300 uppercase tracking-wider">All Linked Hosp Tables:</h4>
              <div class="grid grid-cols-2 gap-2">
                <template x-for="rel in activeTable.relationships" :key="rel">
                  <button @click="openDetailById(rel)" class="p-2.5 bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-cyan-500/50 rounded-xl text-left text-xs font-mono text-slate-200 transition flex items-center justify-between group">
                    <span x-text="rel"></span>
                    <span class="text-slate-500 group-hover:text-cyan-400 text-[10px]">Jump ➔</span>
                  </button>
                </template>
              </div>
            </div>
          </div>

          <!-- TAB 3: SAMPLE SQL -->
          <div x-show="detailTab === 'sql'" class="space-y-4 flex-1">
            <p class="text-xs text-slate-400">Copy-paste this starter query for BigQuery or PostgreSQL to query <code class="text-cyan-300" x-text="activeTable.name"></code>:</p>
            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 font-mono text-xs text-emerald-300 leading-relaxed overflow-x-auto">
              <pre x-text="generateSqlSnippet(activeTable)"></pre>
            </div>
          </div>

        </div>
      </template>
    </div>
  </div>

  <!-- ALPINE APP STATE -->
  <script>
    function erdApp() {

coding system ('HCFA' or 'MS')"}, {"name": "drg_code", "type": "VARCHAR(20)", "key": "", "desc": "DRG code string"}, {"name": "description", "type": "VARCHAR(255)", "key": "", "desc": "DRG diagnosis description"}, {"name": "drg_severity", "type": "SMALLINT", "key": "", "desc": "DRG severity score"}, {"name": "drg_mortality", "type": "SMALLINT", "key": "", "desc": "DRG mortality risk score"}], "relationships": ["patients", "admissions"], "pos": {"x": 1160, "y": 690, "w": 190, "h": 130}}, {"id": "omr", "name": "omr", "category": "Online Medical Record", "category_id": "omr", "description": "Online Medical Record data containing outpatient vital signs and longitudinal metrics (e.g. BMI, BP).", "pk": [], "fk": [{"col": "subject_id", "ref_table": "patients", "ref_col": "subject_id"}], "columns": [{"name": "subject_id", "type": "INTEGER", "key": "FK", "desc": "Foreign key identifying patient"}, {"name": "chartdate", "type": "DATE", "key": "", "desc": "Date measurement recorded"}, {"name": "seq_num", "type": "INTEGER", "key": "", "desc": "Measurement sequence on date"}, {"name": "result_name", "type": "VARCHAR(100)", "key": "", "desc": "Result concept name (e.g. 'Blood Pressure', 'BMI')"}, {"name": "result_value", "type": "VARCHAR(255)", "key": "", "desc": "Result measurement value"}], "relationships": ["patients"], "pos": {"x": 80, "y": 640, "w": 180, "h": 110}}],
        connections: [{"from": "admissions", "to": "patients", "label": "subject_id"}, {"from": "transfers", "to": "patients", "label": "subject_id"}, {"from": "transfers", "to": "admissions", "label": "hadm_id"}, {"from": "services", "to": "admissions", "label": "hadm_id"}, {"from": "omr", "to": "patients", "label": "subject_id"}, {"from": "labevents", "to": "admissions", "label": "hadm_id"}, {"from": "labevents", "to": "d_labitems", "label": "itemid"}, {"from": "microbiologyevents", "to": "admissions", "label": "hadm_id"}, {"from": "poe", "to": "admissions", "label": "hadm_id"}, {"from": "poe", "to": "provider", "label": "order_provider_id"}, {"from": "poe_detail", "to": "poe", "label": "poe_id"}, {"from": "pharmacy", "to": "poe", "label": "poe_id"}, {"from": "prescriptions", "to": "admissions", "label": "hadm_id"}, {"from": "prescriptions", "to": "pharmacy", "label": "pharmacy_id"}, {"from": "emar", "to": "admissions", "label": "hadm_id"}, {"from": "emar", "to": "pharmacy", "label": "pharmacy_id"}, {"from": "emar_detail", "to": "emar", "label": "emar_id"}, {"from": "diagnoses_icd", "to": "admissions", "label": "hadm_id"}, {"from": "diagnoses_icd", "to": "d_icd_diagnoses", "label": "icd_code"}, {"from": "procedures_icd", "to": "admissions", "label": "hadm_id"}, {"from": "procedures_icd", "to": "d_icd_procedures", "label": "icd_code"}, {"from": "hcpcsevents", "to": "admissions", "label": "hadm_id"}, {"from": "hcpcsevents", "to": "d_hcpcs", "label": "hcpcs_cd"}, {"from": "drgcodes", "to": "admissions", "label": "hadm_id"}],
        viewMode: 'svg',
        selectedCategory: 'all',
        searchQuery: '',
        hoveredTable: null,
        detailOpen: false,
        detailTab: 'schema',
        activeTable: null,

        categories: [
          { id: 'core', name: 'Patients & Admissions', icon: '🏥', description: 'Core patient demographics, hospital admissions, transfers, and provider registry' },
          { id: 'labs', name: 'Labs & Microbiology', icon: '🧪', description: 'Laboratory test results, lab concept dictionary, and microbiology cultures' },
          { id: 'meds', name: 'Orders & Medications', icon: '💊', description: 'Provider order entry (POE), pharmacy orders, prescriptions, and eMAR records' },
          { id: 'billing', name: 'Billing & Coding', icon: '🏷️', description: 'ICD-9/10 diagnosis and procedure codes, HCPCS, DRG billing classifications' },
          { id: 'omr', name: 'Online Medical Record', icon: '📁', description: 'Outpatient vitals and longitudinal health metrics (BMI, BP)' }
        ],

        get filteredTables() {
          return this.tables.filter(t => {
            const matchCat = this.selectedCategory === 'all' || t.category_id === this.selectedCategory;
            if (!matchCat) return false;

            if (!this.searchQuery) return true;
            const q = this.searchQuery.toLowerCase();
            const matchName = t.name.toLowerCase().includes(q);
            const matchDesc = t.description.toLowerCase().includes(q);
            const matchCol = t.columns.some(c => c.name.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q));
            return matchName || matchDesc || matchCol;
          });
        },

        getCategoryTables(catId) {
          return this.filteredTables.filter(t => t.category_id === catId);
        },

        getCategoryCount(catId) {
          return this.tables.filter(t => t.category_id === catId).length;
        },

        resetFilters() {
          this.searchQuery = '';
          this.selectedCategory = 'all';
          this.hoveredTable = null;
        },

        openDetail(table) {
          this.activeTable = table;
          this.detailTab = 'schema';
          this.detailOpen = true;
        },

        openDetailById(tableId) {
          const t = this.tables.find(item => item.id === tableId);
          if (t) {
            this.openDetail(t);
          }
        },

        isTableVisible(table) {
          return this.filteredTables.some(t => t.id === table.id);
        },

        get filteredConnections() {
          const visibleIds = new Set(this.filteredTables.map(t => t.id));
          return this.connections.filter(c => visibleIds.has(c.from) && visibleIds.has(c.to));
        },

        get connectionsSvgHtml() {
          const paths = this.filteredConnections.map(conn => {
            const d = this.calculatePath(conn.from, conn.to);
            const stroke = this.getConnectionColor(conn);
            const w = this.isConnectionActive(conn) ? '3.5' : '1.5';
            const dash = this.isConnectionActive(conn) ? 'none' : '4,4';
            return `<path d="${d}" fill="none" stroke="${stroke}" stroke-width="${w}" stroke-dasharray="${dash}" marker-end="url(#arrow)" class="svg-connection"></path>`;
          }).join('');
          return `<svg class="w-[1650px] h-[980px]" viewBox="0 0 1650 980" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7"></path></marker></defs>${paths}</svg>`;
        },

        calculatePath(fromId, toId) {
          const fromObj = this.tables.find(t => t.id === fromId);
          const toObj = this.tables.find(t => t.id === toId);
          if (!fromObj || !toObj) return 'M 0 0 L 0 0';

          const x1 = fromObj.pos.x + fromObj.pos.w;
          const y1 = fromObj.pos.y + fromObj.pos.h / 2;
          const x2 = toObj.pos.x;
          const y2 = toObj.pos.y + toObj.pos.h / 2;

          const dx = Math.abs(x2 - x1) / 2;
          return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
        },

        isConnectionActive(conn) {
          if (!this.hoveredTable) return false;
          return conn.from === this.hoveredTable || conn.to === this.hoveredTable;
        },

        getConnectionColor(conn) {
          if (this.isConnectionActive(conn)) return '#38bdf8';
          if (this.hoveredTable) return '#1e293b';
          return '#0284c7';
        },

        getNodeBg(table) {
          if (this.hoveredTable === table.id) return '#0f172a';
          if (this.hoveredTable && table.relationships.includes(this.hoveredTable)) return '#022c22';
          return '#0f172a';
        },

        getNodeStroke(table) {
          if (this.hoveredTable === table.id) return '#38bdf8';
          if (this.hoveredTable && table.relationships.includes(this.hoveredTable)) return '#10b981';
          return '#1e293b';
        },

        getNodeStrokeWidth(table) {
          if (this.hoveredTable === table.id || (this.hoveredTable && table.relationships.includes(this.hoveredTable))) return '2.5';
          return '1.5';
        },

        getHeaderFill(table) {
          if (table.category_id === 'core') return '#0284c7';
          if (table.category_id === 'labs') return '#0d9488';
          if (table.category_id === 'meds') return '#9333ea';
          if (table.category_id === 'billing') return '#ca8a04';
          return '#475569';
        },

        getTableCardClass(table) {
          if (this.hoveredTable === table.id) {
            return 'border-cyan-400 ring-2 ring-cyan-500/40 scale-[1.02] z-20';
          }
          if (this.hoveredTable) {
            const hoveredObj = this.tables.find(t => t.id === this.hoveredTable);
            if (hoveredObj && hoveredObj.relationships.includes(table.id)) {
              return 'border-emerald-500/80 bg-slate-900/90 ring-1 ring-emerald-500/30 z-10';
            }
            return 'opacity-40 border-slate-800';
          }
          return 'border-slate-800 hover:border-slate-700';
        },

        getHeaderBgClass(table) {
          if (this.hoveredTable === table.id) {
            return 'from-cyan-900/80 to-blue-900/80 border-cyan-500/50';
          }
          if (this.hoveredTable) {
            const hoveredObj = this.tables.find(t => t.id === this.hoveredTable);
            if (hoveredObj && hoveredObj.relationships.includes(table.id)) {
              return 'from-emerald-950 to-slate-900 border-emerald-500/40';
            }
          }
          return 'from-slate-800 to-slate-900 border-slate-800';
        },

        generateSqlSnippet(table) {
          if (!table) return '';
          let sql = `-- Querying MIMIC-IV hosp.${table.name}\nSELECT\n`;
          const cols = table.columns.map(c => `  ${table.name}.${c.name}`).join(',\n');
          sql += cols + `\nFROM \`physionet-data.mimiciv_hosp.\${table.name}\` AS ${table.name}\n`;

          if (table.name === 'admissions') {
            sql += `JOIN \`physionet-data.mimiciv_hosp.patients\` AS patients\n  ON admissions.subject_id = patients.subject_id\n`;
          } else if (table.fk.length > 0) {
            for (const ref of table.fk) {
              sql += `JOIN \`physionet-data.mimiciv_hosp.\${ref.ref_table}\` AS ${ref.ref_table}\n  ON ${table.name}.${ref.col} = ${ref.ref_table}.${ref.ref_col}\n`;
            }
          }
          sql += `LIMIT 100;`;
          return sql;
        }
      }
    }
