<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XOR Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0f172a; color: #e2e8f0; }
    .dot { width: 10px; height: 10px; border-radius: 50%; position: absolute; transform: translate(-50%,-50%); }
    .dot-c0 { background: #f87171; }
    .dot-c1 { background: #60a5fa; }
    .grid-point { width: 4px; height: 4px; border-radius: 50%; position: absolute; transform: translate(-50%,-50%); }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-8 font-mono">

  <h1 class="text-2xl font-bold mb-2 text-emerald-400">XOR Training Dashboard</h1>
  <p class="text-sm text-gray-400 mb-6">Django + SSE + PyTorch</p>

  <div class="flex gap-8 items-start">
    <!-- canvas -->
    <div>
      <div id="canvas" class="relative border border-gray-600 rounded-lg overflow-hidden" style="width:420px;height:420px;background:#1e293b;"></div>
      <button id="btn" onclick="startTrain()" class="mt-3 w-full py-2 rounded bg-emerald-600 hover:bg-emerald-500 font-bold transition">Start Training</button>
    </div>
    <!-- info -->
    <div class="w-56 space-y-4">
      <div class="bg-gray-800 rounded p-4">
        <div class="text-xs text-gray-400 mb-1">Epoch</div>
        <div id="epoch" class="text-3xl font-bold text-emerald-400">0</div>
      </div>
      <div class="bg-gray-800 rounded p-4">
        <div class="text-xs text-gray-400 mb-1">Loss</div>
        <div id="loss" class="text-2xl font-bold text-yellow-400">-</div>
      </div>
      <div class="bg-gray-800 rounded p-4">
        <div class="text-xs text-gray-400 mb-1">Predictions</div>
        <div id="pred" class="text-sm text-gray-300 leading-relaxed">-</div>
      </div>
    </div>
  </div>

<script>
const W = 420, P = 20, S = W / P;

const canvas = document.getElementById('canvas');

function px(v){ return v * W; }
function py(v){ return W - v * W; }

function drawGrid(grid){
  document.querySelectorAll('.grid-point').forEach(e=>e.remove());
  grid.forEach(p=>{
    const d = document.createElement('div');
    d.className = 'grid-point';
    const r = Math.round(p.v*255);
    d.style.background = `rgba(${255-r}, ${r+60}, 180, 0.45)`;
    d.style.left = px(p.x)+'px';
    d.style.top  = py(p.y)+'px';
    canvas.appendChild(d);
  });
}

function drawDots(data){
  document.querySelectorAll('.dot').forEach(e=>e.remove());
  data.forEach(p=>{
    const d = document.createElement('div');
    d.className = 'dot dot-c'+p.label;
    d.style.left = px(p.x)+'px';
    d.style.top  = py(p.y)+'px';
    canvas.appendChild(d);
  });
}

function startTrain(){
  document.getElementById('btn').disabled = true;
  document.getElementById('btn').textContent = 'Training...';
  const es = new EventSource('/train/');
  es.onmessage = function(e){
    const m = JSON.parse(e.data);
    if(m.type==='scatter') drawDots(m.data);
    if(m.type==='update'){
      document.getElementById('epoch').textContent = m.epoch;
      document.getElementById('loss').textContent = m.loss.toFixed(4);
      document.getElementById('pred').textContent =
        '(0,0)='+m.pred[0].toFixed(3)+'  (0,1)='+m.pred[1].toFixed(3)+'\n'+
        '(1,0)='+m.pred[2].toFixed(3)+'  (1,1)='+m.pred[3].toFixed(3);
      drawGrid(m.grid);
    }
    if(m.type==='done'){
      es.close();
      document.getElementById('btn').disabled = false;
      document.getElementById('btn').textContent = 'Start Training';
    }
  };
}
</script>
</body>
</html>
